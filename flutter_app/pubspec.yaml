name: armin_transport
description: "Armin Transport for Android and Windows: shipments, documents and customer tracking."
publish_to: 'none'

# In Android, the part before "+" is the versionName and the part after it the versionCode.
# In Windows, they are the product version and the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Material Design widgets (since Flutter 3.44 a package of their own; go_router builds on it as well).
  material_ui: ^1.11.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Vazirmatn (SIL Open Font License 1.1, see assets/fonts/OFL.txt) is bundled so that Persian text
  # looks the same on every device, with or without network access.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
