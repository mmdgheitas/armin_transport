# Alembic settings for Flask-Migrate. Run migrations through the Flask CLI:
#
#     flask db upgrade            apply every pending migration
#     flask db downgrade          revert the latest migration
#     flask db migrate -m "..."   autogenerate a migration from model changes (review it!)
#     flask db upgrade --sql      print the SQL instead of executing it
#
# The database URL comes from the application configuration (DATABASE_URL); logging is
# configured by the application factory, so this file has no logging sections.

[alembic]
# Chronologically sortable file names, e.g. 20261110_1012_3f2a1c9d7b10_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 50
