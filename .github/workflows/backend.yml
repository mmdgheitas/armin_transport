# The backend (Flask API): formatting, static analysis and the test suite on MySQL 8.
name: Backend

on:
  push:
    branches: [main, "arena/**"]
    paths: ["backend/**", "tools/ci/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "tools/ci/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  # A failed step attaches its output to the commit as a check run (tools/ci/publish-check.mjs).
  checks: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: armin_transport_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # A database that exists only for this run; the password protects nothing.
      TEST_DATABASE_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306/armin_transport_test?charset=utf8mb4
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          set -o pipefail
          { ruff check . && ruff format --check . ; } 2>&1 | tee "$RUNNER_TEMP/out/lint.txt"
      - name: Types
        if: always()
        run: |
          set -o pipefail
          mypy 2>&1 | tee "$RUNNER_TEMP/out/types.txt"
      - name: Tests on MySQL
        if: always()
        run: |
          set -o pipefail
          pytest --cov --cov-report=term 2>&1 | tee "$RUNNER_TEMP/out/tests-mysql.txt"
      - name: Tests on the SQLite fallback
        if: always()
        env:
          TEST_DATABASE_URL: ""
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee "$RUNNER_TEMP/out/tests-sqlite.txt"
      - name: Attach the output of what failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_TAIL_CHARS: "50000"
        run: node ../tools/ci/publish-check.mjs backend "$RUNNER_TEMP"/out/*.txt
