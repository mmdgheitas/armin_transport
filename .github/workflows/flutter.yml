# The Flutter app (Android and Windows): static analysis, tests and installable builds.
#
# Every push that touches the app is analyzed and tested. The builds take several minutes
# each, so they run only where their result is wanted:
#   - on main and on version tags (v1.2.0),
#   - when the workflow is started by hand,
#   - on any other branch when the commit message contains "[build]".
# A build does not wait for the tests: it is there to try the app out, also while a test still
# fails. When everything is green, the builds are packaged the way a release offers them
# (an APK and a ZIP of the Windows program); a version tag publishes these two files as a
# GitHub release.
#
# The analyzer fails the check for errors and warnings. Its hints (style) do not fail it; they are
# attached to the commit as a check run named "diag:flutter:analyze.txt".
#
# Optional settings of the repository (Settings > Secrets and variables > Actions):
#   variables  API_BASE_URL    the server address compiled into the app; without it the app asks on first start
#              REQUIRE_HTTPS   "true" refuses plain HTTP even inside a local network
#   secrets    ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#              the release key of the Android app (base64 -w0 upload-keystore.jks); without them
#              the APK is signed with the debug key and is only good for trying the app out
name: Flutter app

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
    paths: ["flutter_app/**", "tools/ci/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["flutter_app/**", "tools/ci/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

permissions:
  contents: read
  # A failed step attaches its output to the commit as a check run (tools/ci/publish-check.mjs).
  checks: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set -o pipefail
          # The lock file is committed: the versions in it are the ones that were tested.
          flutter pub get --enforce-lockfile 2>&1 | tee "$RUNNER_TEMP/out/pub-get.txt"
      - name: Formatting (a notice, never a failure)
        run: |
          # The sources follow "dart format" with the line width from analysis_options.yaml, so an
          # editor that formats on save changes nothing but what was edited.
          changed=$(dart format --output=none lib test | grep -c '^Changed' || true)
          if [ "${changed:-0}" != "0" ]; then
            echo "::notice title=Formatting::$changed file(s) differ from the output of 'dart format lib test'."
          fi
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/out/analyze.txt"
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/out/test.txt"
      - name: Attach the output of what failed and the hints of the analyzer
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAILED: ${{ job.status != 'success' || steps.analyze.outcome != 'success' || steps.test.outcome != 'success' }}
        run: |
          if [ -s "$RUNNER_TEMP/out/test.txt" ]; then
            # The last line of the test run, e.g. "00:48 +217: All tests passed!"
            echo "::notice title=Tests::$(tail -n 1 "$RUNNER_TEMP/out/test.txt" | tr -d '\r')"
          fi
          if [ "$FAILED" = "true" ]; then
            node ../tools/ci/publish-check.mjs flutter "$RUNNER_TEMP"/out/*.txt
          elif grep -q ' • ' "$RUNNER_TEMP/out/analyze.txt"; then
            node ../tools/ci/publish-check.mjs flutter "$RUNNER_TEMP/out/analyze.txt"
          fi
      - name: Report the result
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success'
        run: |
          echo "analyze: ${{ steps.analyze.outcome }}, test: ${{ steps.test.outcome }}"
          exit 1

  android:
    name: Android APK
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No release key is configured: the APK is signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          REQUIRE_HTTPS: ${{ vars.REQUIRE_HTTPS }}
        run: |
          set -o pipefail
          defines=()
          if [ -n "$API_BASE_URL" ]; then defines+=("--dart-define=API_BASE_URL=$API_BASE_URL"); fi
          if [ "$REQUIRE_HTTPS" = "true" ]; then defines+=("--dart-define=REQUIRE_HTTPS=true"); fi
          flutter build apk --release "${defines[@]}" 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          mkdir -p "$RUNNER_TEMP/android"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/android/armin-transport.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: armin-transport-android
          path: ${{ runner.temp }}/android/armin-transport.apk
          if-no-files-found: error
      - name: Attach the log of a failed build
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_TAIL_CHARS: "50000"
        run: node ../tools/ci/publish-check.mjs android "$RUNNER_TEMP/android-build.log"

  windows:
    name: Windows program
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          REQUIRE_HTTPS: ${{ vars.REQUIRE_HTTPS }}
        run: |
          set -o pipefail
          defines=()
          if [ -n "$API_BASE_URL" ]; then defines+=("--dart-define=API_BASE_URL=$API_BASE_URL"); fi
          if [ "$REQUIRE_HTTPS" = "true" ]; then defines+=("--dart-define=REQUIRE_HTTPS=true"); fi
          flutter build windows --release "${defines[@]}" 2>&1 | tee "$RUNNER_TEMP/windows-build.log"
      - name: Add the C++ runtime
        shell: pwsh
        run: |
          # The program needs these three libraries. Next to the program they are found on every
          # computer, also on one where the Visual C++ runtime was never installed.
          $release = "build/windows/x64/runner/Release"
          foreach ($name in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $source = Join-Path $env:SystemRoot "System32/$name"
            if (Test-Path $source) { Copy-Item $source $release } else { Write-Host "::warning::$name was not found" }
          }
          Get-ChildItem $release | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: armin-transport-windows
          path: flutter_app/build/windows/x64/runner/Release
          if-no-files-found: error
      - name: Attach the log of a failed build
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_TAIL_CHARS: "50000"
        run: node ../tools/ci/publish-check.mjs windows "$RUNNER_TEMP/windows-build.log"

  release:
    name: Package and publish
    # Runs after every build, so that packaging is not tried for the first time on the day of a
    # release. Only a version tag publishes; that step is what the write permission is for.
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: armin-transport-android
          path: artifacts/android
      - uses: actions/download-artifact@v8
        with:
          name: armin-transport-windows
          path: artifacts/windows
      - name: Package
        run: |
          # A version tag names the files; any other build is named after its commit.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          for name in armin_transport.exe flutter_windows.dll data/app.so data/icudtl.dat data/flutter_assets; do
            if [ ! -e "artifacts/windows/$name" ]; then echo "::error::The Windows build has no $name"; exit 1; fi
          done
          mkdir release
          mv artifacts/android/armin-transport.apk "release/armin-transport-android-$version.apk"
          (cd artifacts/windows && zip -qr "../../release/armin-transport-windows-x64-$version.zip" .)
          ls -l release
          unzip -l "release/armin-transport-windows-x64-$version.zip" | tail -n 1
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
