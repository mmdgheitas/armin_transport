# The Flutter app (Android and Windows): static analysis, tests and installable builds.
#
# Every push that touches the app is analyzed and tested. The builds take several minutes
# each, so they run only where their result is wanted:
#   - on main and on version tags (v1.2.0),
#   - when the workflow is started by hand,
#   - on any other branch when the commit message contains "[build]".
# A version tag also publishes the builds as a GitHub release.
#
# Optional settings of the repository (Settings > Secrets and variables > Actions):
#   variables  API_BASE_URL    the server address compiled into the app; without it the app asks on first start
#              REQUIRE_HTTPS   "true" refuses plain HTTP even inside a local network
#   secrets    ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#              the release key of the Android app (base64 -w0 upload-keystore.jks); without them
#              the APK is signed with the debug key and is only good for trying the app out
name: Flutter app

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
    paths: ["flutter_app/**", "tools/ci/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["flutter_app/**", "tools/ci/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

permissions:
  contents: read
  # A failed step attaches its output to the commit as a check run (tools/ci/publish-check.mjs).
  checks: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set -o pipefail
          # The lock file is committed: the versions in it are the ones that were tested.
          flutter pub get --enforce-lockfile 2>&1 | tee "$RUNNER_TEMP/out/pub-get.txt"
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/out/analyze.txt"
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/out/test.txt"
      - name: Attach the output of what failed
        if: always() && (failure() || steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../tools/ci/publish-check.mjs flutter "$RUNNER_TEMP"/out/*.txt
      - name: Report the result
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success'
        run: |
          echo "analyze: ${{ steps.analyze.outcome }}, test: ${{ steps.test.outcome }}"
          exit 1

  android:
    name: Android APK
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No release key is configured: the APK is signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          REQUIRE_HTTPS: ${{ vars.REQUIRE_HTTPS }}
        run: |
          set -o pipefail
          defines=()
          if [ -n "$API_BASE_URL" ]; then defines+=("--dart-define=API_BASE_URL=$API_BASE_URL"); fi
          if [ "$REQUIRE_HTTPS" = "true" ]; then defines+=("--dart-define=REQUIRE_HTTPS=true"); fi
          flutter build apk --release "${defines[@]}" 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          mkdir -p "$RUNNER_TEMP/android"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/android/armin-transport.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: armin-transport-android
          path: ${{ runner.temp }}/android/armin-transport.apk
          if-no-files-found: error
      - name: Attach the log of a failed build
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_TAIL_CHARS: "50000"
        run: node ../tools/ci/publish-check.mjs android "$RUNNER_TEMP/android-build.log"

  windows:
    name: Windows program
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          REQUIRE_HTTPS: ${{ vars.REQUIRE_HTTPS }}
        run: |
          set -o pipefail
          defines=()
          if [ -n "$API_BASE_URL" ]; then defines+=("--dart-define=API_BASE_URL=$API_BASE_URL"); fi
          if [ "$REQUIRE_HTTPS" = "true" ]; then defines+=("--dart-define=REQUIRE_HTTPS=true"); fi
          flutter build windows --release "${defines[@]}" 2>&1 | tee "$RUNNER_TEMP/windows-build.log"
      - name: Add the C++ runtime
        shell: pwsh
        run: |
          # The program needs these three libraries. Next to the program they are found on every
          # computer, also on one where the Visual C++ runtime was never installed.
          $release = "build/windows/x64/runner/Release"
          foreach ($name in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $source = Join-Path $env:SystemRoot "System32/$name"
            if (Test-Path $source) { Copy-Item $source $release } else { Write-Host "::warning::$name was not found" }
          }
          Get-ChildItem $release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: armin-transport-windows
          path: flutter_app/build/windows/x64/runner/Release
          if-no-files-found: error
      - name: Attach the log of a failed build
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_TAIL_CHARS: "50000"
        run: node ../tools/ci/publish-check.mjs windows "$RUNNER_TEMP/windows-build.log"

  release:
    name: Publish the release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          apk="armin-transport-android-$GITHUB_REF_NAME.apk"
          zip="armin-transport-windows-x64-$GITHUB_REF_NAME.zip"
          mv armin-transport-android/armin-transport.apk "$apk"
          (cd armin-transport-windows && zip -qr "../$zip" .)
          gh release create "$GITHUB_REF_NAME" "$apk" "$zip" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
