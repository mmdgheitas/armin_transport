# The web client: lint, unit tests, the production build, and the browser tests
# against the real backend with a MySQL database.
name: Web client

on:
  push:
    branches: [main, "arena/**"]
    # The browser tests run the backend, so a change there is a reason to run them as well.
    paths: ["web/**", "backend/**", "tools/ci/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "backend/**", "tools/ci/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  # A failed step attaches its output to the commit as a check run (tools/ci/publish-check.mjs).
  checks: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # The optional dependency is a browser for machines that have none; the runner has Chrome.
          npm ci --omit=optional
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/out/lint.txt"
      - name: Unit tests
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/out/unit.txt"
      - name: Build
        if: always()
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/out/build.txt"
      - name: Attach the output of what failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_TAIL_CHARS: "50000"
        run: node ../tools/ci/publish-check.mjs web "$RUNNER_TEMP"/out/*.txt

  browser:
    name: Browser tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: armin_transport_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # The tests create and drop a database of their own next to this one; the password protects nothing.
      E2E_DATABASE_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306/armin_transport_test?charset=utf8mb4
      BACKEND_PYTHON: python
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python -m pip install --disable-pip-version-check -r ../backend/requirements.txt
          npm ci --omit=optional
      - name: Build
        run: npm run build
      - name: Browser tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/out/browser.txt"
      - name: Keep the screenshots of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: web/test-results
          if-no-files-found: ignore
      - name: Attach the output of what failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_TAIL_CHARS: "50000"
        run: node ../tools/ci/publish-check.mjs web-browser "$RUNNER_TEMP"/out/*.txt
